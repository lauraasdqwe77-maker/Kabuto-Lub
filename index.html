<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#215b45">
<title>Kabuto-Lub · 昆虫档案 V0.2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#233c32;background:#f3f5f1}*{box-sizing:border-box}body{margin:0;padding:0 16px 80px}header{max-width:760px;margin:0 auto;padding:26px 2px 12px}h1{font-size:29px;color:#215b45;margin:0 0 6px}h2{font-size:20px;margin:0 0 16px}p{margin:7px 0;color:#62746a;font-size:14px}.container{max-width:760px;margin:auto}.panel{background:#fff;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #143b2310}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;color:#455d50;margin:0 0 6px}input,select,textarea{width:100%;border:1px solid #d9e2db;background:#fff;border-radius:11px;padding:12px;font-size:16px;color:#223d30;min-width:0}textarea{min-height:76px;resize:vertical}button,.button{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:650;cursor:pointer;background:#286548;color:#fff}button.secondary{background:#e9f0eb;color:#286548}button.danger{background:#fff0ee;color:#a73d35}button.small{font-size:13px;padding:8px 10px}button:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.muted{color:#75887d;font-size:13px}.badge{display:inline-block;background:#e7f1ea;color:#286548;padding:4px 9px;border-radius:30px;font-size:12px;margin:3px 4px 3px 0}.insect{border:1px solid #e3eae5;border-radius:15px;padding:15px;margin:10px 0}.insect-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.insect h3{margin:0;font-size:17px;overflow-wrap:anywhere}.meta{margin:9px 0 13px;font-size:13px;color:#61776a;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.stat{background:#eaf2ec;border-radius:13px;padding:12px;text-align:center}.stat b{font-size:23px;display:block;color:#23583f}.stat span{font-size:12px;color:#587462}.notice{background:#fff7e8;color:#8a6126;padding:12px;border-radius:12px;font-size:13px;line-height:1.6;margin:12px 0}.hide{display:none!important}.line{border-top:1px solid #edf0ed;margin:14px 0}.empty{text-align:center;padding:20px;color:#7a8b81}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.footer{font-size:12px;text-align:center;color:#84948a;padding:12px}#detail{scroll-margin-top:12px}#photoPreview{max-width:100%;max-height:220px;border-radius:12px;margin:8px 0} @media(max-width:420px){.row{grid-template-columns:1fr}.panel{padding:17px}.stats{gap:6px}}
</style>
</head>
<body>
<header><h1>🪲 Kabuto-Lub <span style="font-size:12px;vertical-align:middle">V0.2</span></h1><p>昆虫个体档案 · 成长与繁育记录</p></header>
<main class="container">
<div class="notice">🔒 当前数据仅保存在这台设备的当前浏览器中，不会自动同步。建议经常使用下方「导出备份」保存 JSON 文件。照片仅存缩略图，请勿把这里当作唯一档案。</div>
<section class="stats"><div class="stat"><b id="total">0</b><span>昆虫总数</span></div><div class="stat"><b id="adult">0</b><span>成虫</span></div><div class="stat"><b id="events">0</b><span>成长/繁育记录</span></div></section>
<section class="panel"><h2 id="formTitle">＋ 新建昆虫档案</h2><form id="insectForm">
<div class="row"><div class="field"><label for="code">昆虫编号 *</label><input id="code" maxlength="60" placeholder="例如 Ny0001" required></div><div class="field"><label for="species">品种 *</label><input id="species" maxlength="80" placeholder="例如 南洋大兜" required></div></div>
<div class="row"><div class="field"><label for="sex">性别</label><select id="sex"><option>未知</option><option>公</option><option>母</option></select></div><div class="field"><label for="stage">当前阶段</label><select id="stage"><option>未知</option><option>卵</option><option>L1</option><option>L2</option><option>L3</option><option>蛹</option><option>成虫</option></select></div></div>
<div class="row"><div class="field"><label for="length">体长 (mm)</label><input id="length" type="number" min="0" max="500" step="0.1" placeholder="选填"></div><div class="field"><label for="weight">体重 (g)</label><input id="weight" type="number" min="0" max="1000" step="0.01" placeholder="选填"></div></div>
<div class="row"><div class="field"><label for="hatchDate">孵化日期</label><input id="hatchDate" type="date"></div><div class="field"><label for="emergeDate">羽化日期</label><input id="emergeDate" type="date"></div></div>
<div class="row"><div class="field"><label for="father">父虫编号</label><input id="father" maxlength="60" placeholder="选填"></div><div class="field"><label for="mother">母虫编号</label><input id="mother" maxlength="60" placeholder="选填"></div></div>
<div class="field"><label for="breeding">繁育状态</label><select id="breeding"><option>未配对</option><option>已配对</option><option>产卵中</option><option>已产卵</option><option>其他</option></select></div>
<div class="field"><label for="notes">备注</label><textarea id="notes" maxlength="2000" placeholder="产地、血统、饲养观察等"></textarea></div>
<div class="field"><label for="photo">个体照片（选填；压缩后保存在本机）</label><input id="photo" type="file" accept="image/*"><img id="photoPreview" class="hide" alt="昆虫照片预览"></div>
<div class="actions"><button id="saveBtn" type="submit">保存昆虫档案</button><button type="button" id="cancelEdit" class="secondary hide">取消编辑</button></div></form></section>
<section class="panel"><h2>我的昆虫</h2><div class="field"><label for="search">搜索编号或品种</label><input id="search" placeholder="搜索昆虫..."></div><div id="list"></div></section>
<section id="detail" class="panel hide"><div class="insect-top"><h2 id="detailTitle">昆虫详情</h2><button id="closeDetail" class="secondary small">关闭</button></div><div id="detailInfo"></div><div class="line"></div><h2>成长 / 繁育时间线</h2><form id="eventForm"><div class="row"><div class="field"><label for="eventType">事件类型</label><select id="eventType"><option>观察</option><option>称重</option><option>蜕皮</option><option>化蛹</option><option>羽化</option><option>配对</option><option>产卵</option><option>孵化</option><option>其他</option></select></div><div class="field"><label for="eventDate">日期</label><input id="eventDate" type="date" required></div></div><div class="field"><label for="eventNote">记录内容</label><textarea id="eventNote" maxlength="1000" placeholder="例如：与 Ny0002 配对；产卵 20 枚" required></textarea></div><button type="submit">＋ 添加记录</button></form><div id="eventList"></div></section>
<section class="panel"><h2>数据备份</h2><p>升级前先导出一份备份；导入将替换当前所有档案，请谨慎操作。</p><div class="actions"><button id="exportBtn" class="secondary">⬇ 导出备份 JSON</button><button id="importBtn" class="secondary">⬆ 导入备份 JSON</button></div><input id="importFile" type="file" accept="application/json,.json" class="hide"></section>
<div class="footer">Kabuto-Lub V0.2 · 本地单机版 · 尚未接入云数据库 / AI</div>
</main>
<script>
'use strict';
const KEY='kabuto_insects', BACKUP='kabuto_v02_backup';
const $=id=>document.getElementById(id);
const fields=['code','species','sex','stage','length','weight','hatchDate','emergeDate','father','mother','breeding','notes'];
let insects=[], editing=null, selected=null, imageData='';
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2)}
function cleanString(x,max=2000){return String(x==null?'':x).slice(0,max)}
function normalize(x){return {id:cleanString(x.id||uid(),100),code:cleanString(x.code||x.name,60),species:cleanString(x.species,80),sex:['公','母','未知'].includes(x.sex)?x.sex:'未知',stage:['卵','L1','L2','L3','蛹','成虫'].includes(x.stage)?x.stage:'未知',length:cleanString(x.length,30),weight:cleanString(x.weight,30),hatchDate:cleanString(x.hatchDate,20),emergeDate:cleanString(x.emergeDate,20),father:cleanString(x.father,60),mother:cleanString(x.mother,60),breeding:cleanString(x.breeding||'未配对',30),notes:cleanString(x.notes),photo:typeof x.photo==='string'&&x.photo.startsWith('data:image/')?x.photo:'',events:Array.isArray(x.events)?x.events.slice(0,500).map(e=>({id:cleanString(e.id||uid(),100),type:cleanString(e.type,50),date:cleanString(e.date,20),note:cleanString(e.note,1000)})):[]}}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');insects=Array.isArray(raw)?raw.map(normalize):[]}catch(e){alert('本地数据读取异常，请勿覆盖数据。请先检查浏览器存储。');insects=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(insects));return true}catch(e){alert('保存失败：浏览器存储空间可能不足。请先导出备份，或移除过大的照片。');return false}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function btn(label,cls,fn){const b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b}
function resetForm(){editing=null;imageData='';$('insectForm').reset();$('formTitle').textContent='＋ 新建昆虫档案';$('saveBtn').textContent='保存昆虫档案';$('cancelEdit').classList.add('hide');$('photoPreview').classList.add('hide');$('photo').value=''}
function edit(id){const x=insects.find(v=>v.id===id);if(!x)return;editing=id;fields.forEach(k=>$(k).value=x[k]||(['sex','stage','breeding'].includes(k)?({sex:'未知',stage:'未知',breeding:'未配对'}[k]):''));imageData=x.photo;$('photoPreview').src=x.photo||'';$('photoPreview').classList.toggle('hide',!x.photo);$('formTitle').textContent='编辑 · '+x.code;$('saveBtn').textContent='保存修改';$('cancelEdit').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})}
function render(){const q=$('search').value.trim().toLowerCase();$('total').textContent=insects.length;$('adult').textContent=insects.filter(x=>x.stage==='成虫').length;$('events').textContent=insects.reduce((s,x)=>s+x.events.length,0);const list=$('list');list.replaceChildren();const filtered=insects.filter(x=>(x.code+' '+x.species).toLowerCase().includes(q));if(!filtered.length)list.append(el('div','empty',insects.length?'没有匹配的昆虫':'还没有档案，先添加第一只昆虫吧 🪲'));filtered.forEach(x=>{const box=el('div','insect'),top=el('div','insect-top'),h=el('h3','', '🪲 '+x.code),meta=el('div','meta',x.species+' · '+x.sex+' · '+x.stage+(x.breeding?' · '+x.breeding:'')),act=el('div','actions');top.append(h,el('span','badge',x.events.length+' 条记录'));act.append(btn('查看档案','small',()=>showDetail(x.id)),btn('编辑','small secondary',()=>edit(x.id)),btn('删除','small danger',()=>removeInsect(x.id)));box.append(top,meta,act);list.append(box)});if(selected){if(insects.some(x=>x.id===selected))showDetail(selected,false);else{$('detail').classList.add('hide');selected=null}}}
function removeInsect(id){const x=insects.find(v=>v.id===id);if(!x||!confirm('确定删除「'+x.code+'」及其全部时间线记录吗？此操作无法撤销。'))return;const old=insects;insects=insects.filter(v=>v.id!==id);if(!save()){insects=old;return}if(editing===id)resetForm();render()}
function showDetail(id,scroll=true){const x=insects.find(v=>v.id===id);if(!x)return;selected=id;$('detail').classList.remove('hide');$('detailTitle').textContent='🪲 '+x.code;const info=$('detailInfo');info.replaceChildren();const desc=el('div','meta');[['品种',x.species],['性别',x.sex],['阶段',x.stage],['体长',x.length?x.length+' mm':'未记录'],['体重',x.weight?x.weight+' g':'未记录'],['孵化',x.hatchDate||'未记录'],['羽化',x.emergeDate||'未记录'],['父虫',x.father||'未记录'],['母虫',x.mother||'未记录'],['繁育状态',x.breeding],['备注',x.notes||'无']].forEach(([k,v])=>{const line=el('div','',k+'：'+v);line.style.overflowWrap='anywhere';desc.append(line)});if(x.photo){const img=el('img');img.src=x.photo;img.alt='昆虫照片';img.style.cssText='max-width:100%;max-height:280px;border-radius:12px;display:block;margin:8px 0';info.append(img)}info.append(desc);$('eventDate').valueAsDate=new Date();const events=$('eventList');events.replaceChildren();const sorted=[...x.events].sort((a,b)=>b.date.localeCompare(a.date));if(!sorted.length)events.append(el('div','empty','还没有成长或繁育记录'));sorted.forEach(e=>{const box=el('div','insect'),top=el('div','insect-top');top.append(el('strong','',e.type+' · '+e.date),btn('删除','small danger',()=>{if(!confirm('删除这条记录？'))return;const old=[...x.events];x.events=x.events.filter(v=>v.id!==e.id);if(!save())x.events=old;render()}));box.append(top,el('div','meta',e.note));events.append(box)});if(scroll)$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('insectForm').addEventListener('submit',e=>{e.preventDefault();const x={};fields.forEach(k=>x[k]=$(k).value.trim());if(!x.code||!x.species){alert('请填写编号和品种');return}if(insects.some(v=>v.code.toLowerCase()===x.code.toLowerCase()&&v.id!==editing)){alert('昆虫编号不能重复');return}const old=[...insects];if(editing){const i=insects.findIndex(v=>v.id===editing);if(i<0)return;insects[i]={...insects[i],...x,photo:imageData}}else{insects.push(normalize({...x,id:uid(),photo:imageData,events:[]}))}if(!save()){insects=old;return}resetForm();render()});
$('cancelEdit').addEventListener('click',resetForm);$('search').addEventListener('input',render);$('closeDetail').addEventListener('click',()=>{$('detail').classList.add('hide');selected=null});
$('eventForm').addEventListener('submit',e=>{e.preventDefault();const x=insects.find(v=>v.id===selected);if(!x)return;const event={id:uid(),type:$('eventType').value,date:$('eventDate').value,note:$('eventNote').value.trim()};if(!event.date||!event.note)return; x.events.push(event);if(!save()){x.events.pop();return}$('eventNote').value='';render()});
$('photo').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('请选择图片');return}if(f.size>12*1024*1024){alert('图片超过 12MB，请先缩小');return}try{const image=await createImageBitmap(f);const scale=Math.min(1,800/Math.max(image.width,image.height));const c=document.createElement('canvas');c.width=Math.round(image.width*scale);c.height=Math.round(image.height*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);imageData=c.toDataURL('image/jpeg',0.66);image.close();$('photoPreview').src=imageData;$('photoPreview').classList.remove('hide')}catch(err){alert('无法读取图片，请尝试 JPEG/PNG 格式')}});
$('exportBtn').addEventListener('click',()=>{const data={app:'Kabuto-Lub',version:'0.2',exportedAt:new Date().toISOString(),insects};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='kabuto-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)});
$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('文件太大');const parsed=JSON.parse(await f.text());const arr=Array.isArray(parsed)?parsed:parsed.insects;if(!Array.isArray(arr)||arr.length>10000)throw Error('备份格式无效');const next=arr.map(normalize);if(next.some(x=>!x.code||!x.species))throw Error('档案缺少编号或品种');if(!confirm('导入将替换当前 '+insects.length+' 条昆虫档案。建议先导出当前备份。确定继续？'))return;const old=insects;insects=next;if(!save()){insects=old;return}resetForm();selected=null;$('detail').classList.add('hide');render();alert('导入成功，共 '+insects.length+' 条档案')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}});
load();render();
</script>
</body>
</html>
